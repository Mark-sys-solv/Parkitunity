# Logs Zurich parking occupancy every 15 minutes.
#
# The data is appended to monthly CSV files (data/occupancy/YYYY-MM.csv) and
# committed to the separate branch "data", so main stays free of bot commits.
# See README ("Collected data") for how to use it locally.
#
# Notes:
# - GitHub may start scheduled runs several minutes late.
# - Scheduled workflows only run from the default branch and are disabled
#   after 60 days without repository activity (public repos).

name: Collect parking occupancy

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: # allows manual runs from the Actions tab

permissions:
  contents: write # needed to push to the data branch

concurrency:
  group: collect-occupancy
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install requests pandas python-dotenv

      - name: Check out data branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch --depth=1 origin data:data
            git worktree add data-branch data
          else
            echo "Branch 'data' does not exist yet, creating it"
            git worktree add --detach data-branch
            cd data-branch
            git checkout --orphan data
            git rm -rf --quiet .
          fi

      - name: Collect occupancy
        run: python -m src.data.collector --no-db --csv-dir data-branch/data/occupancy

      - name: Commit and push
        working-directory: data-branch
        run: |
          git add -f data/occupancy
          if git diff --cached --quiet; then
            echo "No new data"
            exit 0
          fi
          git commit -m "Occupancy data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin data || (git pull --rebase origin data && git push origin data)
